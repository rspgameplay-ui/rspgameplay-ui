<svg xmlns="http://www.w3.org/2000/svg" width="766" height="242" viewBox="0 0 766 242">
<style>text{font:13px Consolas,'Courier New',monospace;fill:#b8ffcb}.a{fill:#00ff41}.p{fill:#00ff41;font-weight:bold}.i{fill:#b8ffcb}
@keyframes in{from{opacity:0;transform:translateX(-6px)}to{opacity:1;transform:none}}
.scan{animation:sc 5s linear infinite}@keyframes sc{from{transform:translateY(-40px)}to{transform:translateY(242px)}}</style>
<rect width="100%" height="100%" rx="10" fill="#000" stroke="#00ff41" stroke-opacity=".35"/>
<circle cx="20" cy="16" r="5" fill="#ff5f56"/><circle cx="38" cy="16" r="5" fill="#ffbd2e"/><circle cx="56" cy="16" r="5" fill="#27c93f"/>
<clipPath id="c"><rect x="20" y="30" height="24" width="0"><animate attributeName="width" from="0" to="261" dur="1.2s" begin=".3s" fill="freeze" calcMode="discrete" values="20;27;35;43;51;59;67;74;82;90;98;106;114;122;129;137;145;153;161;169;177;184;192;200;208;216;224;231;239;247;255;263;271;279"/></rect></clipPath>
<text x="24" y="48" clip-path="url(#c)" xml:space="preserve"><tspan class="p">renan@pires:~$</tspan><tspan class="i"> cat sobre_mim.txt</tspan></text>
<text x="24" y="66" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 1.60s forwards"></text>
<text x="24" y="84" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 1.72s forwards">  Graduando em Engenharia de Software pela UNDB e estagiário de</text>
<text x="24" y="102" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 1.84s forwards">  desenvolvimento na Defensoria Pública do Maranhão. Construo soluções</text>
<text x="24" y="120" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 1.96s forwards">  digitais que unem automação, integração de sistemas e boas</text>
<text x="24" y="138" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 2.08s forwards">  experiências de uso.</text>
<text x="24" y="156" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 2.20s forwards"></text>
<text x="24" y="174" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 2.32s forwards">  Meu diferencial está na ponte entre design e tecnologia: transformo</text>
<text x="24" y="192" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 2.44s forwards">  fluxos complexos em interfaces claras e soluções que fazem sentido</text>
<text x="24" y="210" xml:space="preserve" class="i" style="opacity:0;animation:in .4s 2.56s forwards">  para quem usa.</text>
<text x="24" y="228" class="a" style="opacity:0;animation:in .1s 2.68s forwards">█<animate attributeName="fill-opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></text>
</svg>