<text x="24" y="84" xml:space="preserve" class="a" style="opacity:0;animation:in .4s 1.72s forwards">  01  Produto antes de ferramenta   tecnologia boa resolve problema real</text>
<text x="24" y="102" xml:space="preserve" class="a" style="opacity:0;animation:in .4s 1.84s forwards">  02  Design com propósito          interface intuitiva é qualidade técnica</text>
